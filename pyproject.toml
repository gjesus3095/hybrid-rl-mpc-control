[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rl-ik-control"
version = "0.1.0"
description = "Hybrid RL base control and IK/QP robotic manipulation"
readme = "README.md"
license-files = [
    "docs/licenses/hybrid_push_control_panda-LICENSE",
    "src/hybrid_control/sim_interfaces/mujoco/models/panda/LICENSE",
    "docs/licenses/IsaacLab-LICENSE",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "scipy>=1.9",
    "matplotlib>=3.7",
    "osqp>=0.6.7",
    "mujoco>=3.2",
]

[project.optional-dependencies]
isaac = [
    "pin-pink==3.3.0",  # Isaac Lab 3.0 pins this; >=3.4 requires pin>=4 which upgrades pinocchio
    "qpsolvers>=4.0",
    "daqp==0.8.5",  # same pin as Isaac Lab (its pyproject: ">0.8.5 changes behavior")
]

[dependency-groups]
test = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hybrid_control*"]
namespaces = true

[tool.setuptools.package-data]
"hybrid_control.sim_interfaces.mujoco.models.panda" = [
    "*.xml", "*.md", "*.png", "LICENSE", "assets/*.obj", "assets/*.stl",
]
"hybrid_control.sim_interfaces.isaac.assets.franka" = ["*.urdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
